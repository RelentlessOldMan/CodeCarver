name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Both platforms: the tree-sitter grammars are native libraries (tree-sitter-c.dll / libtree-sitter-c.so) and
    # path handling differs (dot-files are Hidden on Linux, case sensitivity) — a Windows-only CI missed both.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # full history so the build's 1.0.<commit-count> version stamp is accurate

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build CodeCarver.sln -c Release

      # Fast suite. The BuildVerify namespace compiles carved output with pinned toolchains that are not
      # committed, so it runs locally (and under ComputeWarden), not here; its compiler-free halves live in
      # the fast suite.
      - name: Test (fast)
        run: dotnet test CodeCarver.sln -c Release --no-build --filter "FullyQualifiedName!~BuildVerify" --blame-hang-timeout 5m

      # Every example must carve cleanly with the CLI as shipped (exit 0: verify passed).
      - name: Examples
        shell: bash
        run: |
          set -e
          for ex in examples/*/; do
            [ -f "$ex/carve.toml" ] || continue
            echo "== $ex"
            (cd "$ex" && rm -rf out && dotnet ../../src/CodeCarver.Cli/bin/Release/net8.0/codecarver.dll carve src --config carve.toml)
          done

  # The horror oracles: build the eldritch and hellbuild examples with real gcc under strace, carve each one with four
  # input sets at four stages, then build and run every carved tree and require the original's output. A carve that
  # verifies but does not build is a silent miss; only this job sees it.
  horror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build src/CodeCarver.Cli -c Release

      - name: Oracles
        shell: pwsh
        run: |
          sudo apt-get install -y strace >/dev/null
          $dll = "src/CodeCarver.Cli/bin/Release/net8.0/codecarver.dll"
          $failed = 0
          foreach ($e in 'eldritch', 'hellbuild') {
            ./tools/eldritch/eldritch-oracle.ps1 -Example $e -CliDll $dll
            if ($LASTEXITCODE -ne 0) { $failed++ }
          }
          exit $failed

  # Every green push to main publishes its zip as GitHub Release v1.0.<commit-count>, the same number the
  # build stamps into `codecarver version`. Packaging is release.ps1, exactly as run locally; the tests already
  # passed in the jobs above, so it skips its own test gate.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, lint, horror]
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # the version is the commit count

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      - name: Package and publish
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "1.0.$(git rev-list --count HEAD)"
          # A re-run of an already released commit is a no-op, not a failure.
          # (Not `gh release view`: its not-found message on stderr is a terminating error under PowerShell 5.1.)
          $tags = gh release list --limit 1000 --json tagName -q '.[].tagName'
          if ($tags -contains "v$version") { Write-Host "v$version already released"; exit 0 }
          ./release.ps1 -Version $version -SkipTests
          if (-not $?) { throw "release.ps1 failed" }
          # Run the shipped self-check from the unpacked zip, so a release is only cut if the zip itself passes it.
          Expand-Archive "dist/codecarver-$version.zip" "dist/check"
          powershell -NoProfile -ExecutionPolicy Bypass -File dist/check/tools/selfcheck/selfcheck.ps1
          if ($LASTEXITCODE -ne 0) { throw "self-check failed" }
          $short = (git rev-parse --short=7 HEAD).Trim()
          gh release create "v$version" "dist/codecarver-$version.zip" --target $env:GITHUB_SHA --title "CodeCarver $version" --notes "Build $version+$short. Windows and Linux (x64), needs the .NET 8 runtime. Run ``dotnet codecarver.dll version`` to check. Docs are in the zip (USAGE.md, SUPPORT.md); trace-capture scripts are in tools/capture; tools/selfcheck/selfcheck.ps1 checks the fixed definition shapes in seconds."
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: shellcheck
        run: |
          sudo apt-get install -y shellcheck >/dev/null
          git ls-files '*.sh' | xargs shellcheck --severity=error
